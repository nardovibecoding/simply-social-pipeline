[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simply-social-pipeline"
version = "1.0.0"
description = "MCP server for local content capture, draft queue, and checkpoints"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0"]

[project.scripts]
content-pipeline = "server:mcp.run"
